<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice">
  <title>Whale Dream · shallow-water backdrop (light)</title>
  <defs>
    <linearGradient id="l-sea" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F2FAFF"/>
      <stop offset="0.34" stop-color="#D8EEFA"/>
      <stop offset="0.7" stop-color="#B4D8EC"/>
      <stop offset="1" stop-color="#93C2DE"/>
    </linearGradient>

    <linearGradient id="l-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="l-whale" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#A6CBE2"/>
      <stop offset="0.5" stop-color="#7BAAC9"/>
      <stop offset="1" stop-color="#5A8CAE"/>
    </linearGradient>

    <linearGradient id="l-whale-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2DDEE"/>
      <stop offset="1" stop-color="#A6CBE2"/>
    </linearGradient>

    <linearGradient id="l-hair" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#B4CFE4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7FA6C6" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="l-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEAF4"/>
      <stop offset="0.6" stop-color="#B9D2E4"/>
      <stop offset="1" stop-color="#9CBCD4"/>
    </linearGradient>

    <radialGradient id="l-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#D6F0FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#D6F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="l-vignette" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#5E90B4" stop-opacity="0.28"/>
    </radialGradient>

    <filter id="l-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="l-softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="l-far" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#l-sea)"/>

  <!-- sun shafts through the surface -->
  <g opacity="0.9">
    <polygon points="360,-80 520,-80 700,1200 540,1200" fill="url(#l-beam)" opacity="0.9" filter="url(#l-softer)"/>
    <polygon points="940,-80 1060,-80 1180,1200 1040,1200" fill="url(#l-beam)" opacity="0.8" filter="url(#l-softer)"/>
    <polygon points="1480,-80 1576,-80 1680,1200 1552,1200" fill="url(#l-beam)" opacity="0.7" filter="url(#l-softer)"/>
    <polygon points="120,-80 240,-80 300,1200 190,1200" fill="url(#l-beam)" opacity="0.55" filter="url(#l-soft)"/>
  </g>

  <!-- surface waves -->
  <g filter="url(#l-soft)" opacity="0.5">
    <path d="M-40,96 C300,40 620,140 960,96 C1300,52 1620,140 1960,88 L1960,-40 L-40,-40 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M-40,150 C320,104 640,190 980,148 C1320,106 1640,186 1960,140 L1960,60 L-40,60 Z" fill="#EAF7FF" opacity="0.7"/>
  </g>

  <!-- hero whale silhouette -->
  <g transform="translate(150,392) scale(1.06)">
    <path d="M170,232 C208,196 274,188 336,206 C392,222 424,254 470,254 L506,218 C516,242 512,274 496,296 C468,334 408,350 344,344 C274,338 212,312 180,276 C166,258 162,244 170,232 Z" fill="url(#l-whale)"/>
    <path d="M252,262 C330,300 424,314 500,300 L500,308 C420,326 322,312 244,272 Z" fill="#FFFFFF" opacity="0.28"/>
    <path d="M392,214 C406,236 424,252 452,258 C432,262 406,250 392,232 Z" fill="#FFFFFF" opacity="0.22"/>
    <path d="M318,320 C340,352 372,372 412,374 C376,380 336,362 312,332 Z" fill="#4E7C9C" opacity="0.55"/>
    <path d="M170,232 C140,244 116,262 100,284 C124,272 150,262 176,254 Z" fill="#B4D2E6" opacity="0.95"/>
  </g>

  <!-- far whale pod -->
  <g opacity="0.45" filter="url(#l-far)">
    <path d="M232,352 C258,330 302,326 342,338 C378,348 398,368 428,368 L452,346 C458,362 456,382 446,396 C428,420 390,430 348,426 C300,422 258,406 238,382 C230,372 228,362 232,352 Z" fill="url(#l-whale-far)"/>
    <path d="M1592,214 C1612,198 1646,196 1676,206 C1702,214 1716,228 1738,230 L1756,212 C1760,226 1756,242 1748,252 C1732,270 1702,276 1672,272 C1636,266 1606,250 1594,234 C1588,226 1588,220 1592,214 Z" fill="url(#l-whale-far)" opacity="0.8"/>
  </g>

  <!-- whale girl, seen from behind, hair drifting -->
  <g transform="translate(1332,300) scale(0.9)">
    <ellipse cx="170" cy="320" rx="320" ry="400" fill="url(#l-glow)" filter="url(#l-softer)" opacity="0.85"/>

    <!-- drifting hair, three drifting locks -->
    <path d="M172,116 C246,116 288,178 290,252 C292,322 268,386 246,452 C230,500 220,556 216,612 C212,668 214,720 208,768 C192,712 184,650 184,584 C184,516 192,458 200,406 C170,448 140,480 108,506 C142,436 166,380 174,320 C152,354 128,376 100,394 C134,338 158,300 168,254 C174,176 104,110 172,116 Z" fill="url(#l-hair)" filter="url(#l-soft)" opacity="0.95"/>
    <path d="M280,238 C330,296 350,372 340,452 C332,514 312,570 292,622 C306,548 314,472 306,402 C300,342 288,290 280,238 Z" fill="#FFFFFF" opacity="0.62" filter="url(#l-soft)"/>

    <!-- body, back view: shoulders, waist, floating hem -->
    <path d="M150,404 C160,378 190,362 212,360 C236,358 264,374 276,398 C288,424 292,470 290,520 C288,568 282,610 276,642 C262,640 240,641 222,642 C206,642 190,642 176,642 C172,608 168,566 166,520 C164,468 142,430 150,404 Z" fill="url(#l-body)"/>
    <path d="M166,520 C200,534 246,534 290,520 C288,568 282,610 276,642 C240,652 200,652 176,642 C172,608 168,566 166,520 Z" fill="#A7C6DD" opacity="0.62"/>
    <path d="M176,642 C208,662 254,662 276,642 C296,676 300,724 288,772 C258,796 198,796 170,770 C156,722 160,676 176,642 Z" fill="url(#l-body)" opacity="0.96"/>
    <path d="M170,770 C200,796 258,796 288,772 C294,800 292,828 282,850 C250,868 202,866 176,846 C166,822 164,796 170,770 Z" fill="#A9C7DD" opacity="0.95"/>
    <path d="M176,846 C204,866 250,868 282,850 L290,884 L168,884 Z" fill="#8FB2CC" opacity="0.85"/>

    <!-- head -->
    <circle cx="216" cy="292" r="46" fill="#B4CFE4"/>
    <path d="M168,282 C174,234 258,230 272,276 C278,304 276,326 268,344 C250,314 214,300 182,310 C170,314 164,302 168,282 Z" fill="#8FB2CE" opacity="0.95"/>
    <path d="M196,338 C206,348 226,348 236,338 C238,352 234,360 216,360 C198,360 194,352 196,338 Z" fill="#B6CBDB" opacity="0.9"/>

    <!-- drifting light at the hand -->
    <ellipse cx="300" cy="470" rx="76" ry="76" fill="url(#l-glow)" filter="url(#l-soft)" opacity="0.92"/>
    <circle cx="300" cy="476" r="9" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- motes -->
  <g fill="#FFFFFF">
    <circle cx="212" cy="176" r="2.6" opacity="0.8"/>
    <circle cx="486" cy="128" r="1.8" opacity="0.6"/>
    <circle cx="742" cy="286" r="2.2" opacity="0.55"/>
    <circle cx="1028" cy="164" r="1.6" opacity="0.6"/>
    <circle cx="1180" cy="392" r="2.4" opacity="0.5"/>
    <circle cx="1652" cy="452" r="2" opacity="0.55"/>
    <circle cx="1780" cy="238" r="1.6" opacity="0.6"/>
    <circle cx="330" cy="640" r="2.2" opacity="0.45"/>
    <circle cx="880" cy="700" r="1.8" opacity="0.45"/>
    <circle cx="1462" cy="742" r="2.6" opacity="0.4"/>
    <circle cx="656" cy="500" r="1.5" opacity="0.5"/>
    <circle cx="1094" cy="884" r="2.1" opacity="0.38"/>
    <circle cx="240" cy="1010" r="1.7" opacity="0.35"/>
    <circle cx="1712" cy="996" r="2.3" opacity="0.32"/>
  </g>

  <!-- bubbles -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8">
    <circle cx="238" cy="1052" r="9" opacity="0.55"/>
    <circle cx="288" cy="880" r="6" opacity="0.5"/>
    <circle cx="404" cy="746" r="12" opacity="0.42"/>
    <circle cx="1690" cy="1058" r="10" opacity="0.5"/>
    <circle cx="1604" cy="892" r="7" opacity="0.45"/>
    <circle cx="1502" cy="1004" r="5" opacity="0.4"/>
    <circle cx="1812" cy="316" r="8" opacity="0.42"/>
  </g>

  <!-- foreground water shading -->
  <g filter="url(#l-softer)" opacity="0.4">
    <path d="M-60,1180 C280,1096 620,1120 960,1164 C1300,1208 1640,1176 1980,1120 L1980,1220 L-60,1220 Z" fill="#8FB9D6"/>
  </g>

  <rect width="1920" height="1200" fill="url(#l-vignette)"/>
</svg>
